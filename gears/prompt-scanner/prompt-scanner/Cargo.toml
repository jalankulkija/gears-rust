[package]
name = "cf-gears-prompt-scanner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "prompt-scanner gear - tenant-aware content-scanning / verdict microservice"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "prompt_scanner"

[lints]
workspace = true

[dependencies]
# Local dependencies
prompt-scanner-sdk = { package = "cf-gears-prompt-scanner-sdk", version = "0.1.0", path = "../prompt-scanner-sdk" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.2", path = "../../system/types-registry/types-registry-sdk" }
types-registry = { workspace = true }
authz-resolver-sdk = { workspace = true }
authz-resolver = { workspace = true }
file-parser-sdk = { package = "cf-gears-file-parser-sdk", version = "0.2.3", path = "../../file-parser/file-parser-sdk" }
file-parser = { package = "cf-gears-file-parser", version = "0.1.46", path = "../../file-parser/file-parser" }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-odata-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }

# Async runtime
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# HTTP / REST
axum = { workspace = true }
http = { workspace = true }
utoipa = { workspace = true }

# Data types
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }

# Database
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.2", path = "../../system/types-registry/types-registry-sdk", features = [
    "test-util",
] }
