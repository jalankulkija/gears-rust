[package]
name = "cf-gears-openai-interceptor-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenAI/ChatGPT traffic handler plugin for forward-proxy: prompt + attachment scanning via prompt-scanner"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "openai_interceptor_plugin"

[lints]
workspace = true

[dependencies]
forward-proxy-sdk = { package = "cf-gears-forward-proxy-sdk", version = "0.1.0", path = "../../forward-proxy-sdk" }
prompt-scanner-sdk = { package = "cf-gears-prompt-scanner-sdk", version = "0.1.0", path = "../../../prompt-scanner/prompt-scanner-sdk" }
prompt-scanner = { package = "cf-gears-prompt-scanner", version = "0.1.0", path = "../../../prompt-scanner/prompt-scanner" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.2", path = "../../../system/types-registry/types-registry-sdk" }
types-registry = { workspace = true }

toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true, features = ["time"] }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
inventory = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
chrono = { workspace = true }
toolkit-odata = { workspace = true }
